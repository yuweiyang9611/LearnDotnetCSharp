<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#0b1020" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="{{TITLE}} · 在线教材" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="https://yuweiyang9611.github.io/LearnDotnetCSharp/guide/" />
    <meta property="og:image" content="https://yuweiyang9611.github.io/LearnDotnetCSharp/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://yuweiyang9611.github.io/LearnDotnetCSharp/guide/" />
    <title>{{TITLE}} · 在线教材</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="guide-page">
    <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>
    <a class="skip-link" href="#guide-content">跳到教材正文</a>

    <header class="site-header guide-site-header">
      <a class="brand" href="../" aria-label="LearnDotnetCSharp 首页">
        <span class="brand-mark" aria-hidden="true">{ }</span>
        <span>LearnDotnetCSharp</span>
      </a>
      <nav aria-label="教材导航">
        <a class="nav-priority" aria-current="page" href="./">在线教材</a>
        <a href="../#catalog">实验目录</a>
        <a href="../downloads/LearnDotnetCSharp-Study-Guide.pdf" download>下载 PDF</a>
        <a href="https://github.com/yuweiyang9611/LearnDotnetCSharp">GitHub</a>
      </nav>
    </header>

    <main class="guide-shell" id="main">
      <aside class="guide-sidebar" aria-label="教材目录">
        <div class="guide-sidebar-heading">
          <p>教材目录</p>
          <span>{{HEADING_COUNT}} 节</span>
        </div>
        <label class="toc-search">
          <span class="sr-only">筛选教材目录</span>
          <input type="search" data-toc-search placeholder="筛选章节…" autocomplete="off" />
        </label>
        <p class="toc-search-status" data-toc-search-status aria-live="polite"></p>
        <nav class="guide-toc">
          {{TOC_HTML}}
        </nav>
      </aside>

      <article class="guide-main">
        <header class="guide-hero">
          <p class="eyebrow"><span></span> 在线教材 · 与 PDF 同源</p>
          <h1>{{TITLE}}</h1>
          <p class="guide-subtitle">{{SUBTITLE}}</p>
          <div class="guide-meta" aria-label="教材信息">
            <span>{{CHAPTER_COUNT}} 章</span>
            <span>53 个实验</span>
            <span>更新于 {{DATE}}</span>
          </div>
          <div class="hero-actions">
            <a class="button button-primary" id="continue-reading" href="#前言">开始阅读 <span aria-hidden="true">→</span></a>
            <a class="button button-secondary" href="../downloads/LearnDotnetCSharp-Study-Guide.pdf" download>下载离线 PDF</a>
          </div>
        </header>

        <details class="mobile-toc">
          <summary>打开章节目录</summary>
          <label class="toc-search">
            <span class="sr-only">筛选教材目录</span>
            <input type="search" data-toc-search placeholder="筛选章节…" autocomplete="off" />
          </label>
          <p class="toc-search-status" data-toc-search-status aria-live="polite"></p>
          <nav class="guide-toc">
            {{TOC_HTML}}
          </nav>
        </details>

        <div class="guide-content" id="guide-content">
          {{ARTICLE_HTML}}
        </div>

        <footer class="guide-footer">
          <div>
            <strong>继续动手验证</strong>
            <p>网页负责阅读，仓库中的可运行实验负责证明这些机制。</p>
          </div>
          <a class="button button-primary" href="../#catalog">浏览 53 个实验</a>
        </footer>
      </article>
    </main>
    <button class="back-to-top" id="back-to-top" type="button" aria-label="返回页面顶部">↑</button>
    <div class="guide-toast" id="guide-toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
