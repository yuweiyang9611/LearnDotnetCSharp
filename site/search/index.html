          <label class="field-label" for="global-search-input">输入一个或多个关键词</label>

            <button class="nb-button nb-button--solid" type="submit">搜索</button>
          </div>
          <p class="field-note">多个关键词需要同时命中。按 <kbd>/</kbd> 可随时回到搜索框。</p>

        <div class="search-options">
