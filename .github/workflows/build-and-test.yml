name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create workspace Python virtual environment
        run: python -m venv .venv

      - name: Restore
        run: >-
          dotnet restore LearnDotnetCSharp.slnx
          -p:RestoreIgnoreFailedSources=false

      - name: Build
        run: >-
          dotnet build LearnDotnetCSharp.slnx
          --configuration Release
          --no-restore
          -p:EnforceCodeStyleInBuild=true

      - name: Verify whitespace formatting
        # Folder mode does not load the mixed C#/F#/VB MSBuild project graph.
        run: >-
          dotnet format whitespace .
          --folder
          --verify-no-changes
          --include src tests
          --verbosity minimal

      - name: Run tests
        run: >-
          dotnet test
          --solution LearnDotnetCSharp.slnx
          --configuration Release
          --no-restore
          --no-build
          --minimum-expected-tests 30

      - name: Run demo self-test
        run: >-
          dotnet run
          --project src/LearnDotnetCSharp.App
          --configuration Release
          --no-build
          -- self-test
