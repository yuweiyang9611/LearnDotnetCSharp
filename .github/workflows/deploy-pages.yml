name: Deploy study site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - docs/*.md
      - requirements-docs.txt
      - site/**
      - scripts/build-study-site.mjs
      - scripts/markdown_to_pdf.py
      - scripts/markdown_to_site.mjs
      - scripts/templates/**
      - output/pdf/LearnDotnetCSharp-Study-Guide.pdf
      - global.json
      - src/LearnDotnetCSharp.App/**
      - src/LearnDotnetCSharp.Capstones/**
      - tests/site/**
      - playwright.config.mjs
      - package.json
      - package-lock.json
      - scripts/serve-study-site.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-wqy-zenhei

      - name: Install locked PDF dependencies
        run: >-
          python -m pip install
          --no-deps
          --only-binary=:all:
          --requirement requirements-docs.txt

      - name: Build and validate PDF from current Markdown
        run: >-
          python scripts/markdown_to_pdf.py
          --input docs/advanced-dotnet-csharp-study-guide.md
          --output output/pdf/LearnDotnetCSharp-Study-Guide.pdf
          --repo-root .
          --repo-url "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"

      - name: Restore app for the four-layer artifact
        run: dotnet restore src/LearnDotnetCSharp.App/LearnDotnetCSharp.App.csproj

      - name: Generate observed C# / CIL / JIT artifact
        run: >-
          dotnet run
          --project src/LearnDotnetCSharp.App
          --configuration Release
          --no-restore
          -- export-code-layers site/layers/artifacts.json

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find scripts site -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Build and validate static site
        run: node scripts/build-study-site.mjs

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile study flows
        run: npm run test:site

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            artifacts/playwright-results
            artifacts/playwright-report
          retention-days: 7

      - name: Verify the site contains the newly generated PDF
        run: >-
          cmp
          output/pdf/LearnDotnetCSharp-Study-Guide.pdf
          artifacts/study-site/downloads/LearnDotnetCSharp-Study-Guide.pdf

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/study-site
          include-hidden-files: true

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
