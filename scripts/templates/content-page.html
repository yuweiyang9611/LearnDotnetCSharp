<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#f4efe4" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="{{PAGE_TITLE}} · LearnDotnetCSharp" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{PAGE_TITLE}} · LearnDotnetCSharp" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <title>{{PAGE_TITLE}} · LearnDotnetCSharp</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <script>document.documentElement.classList.add("js");</script>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../notebook.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../guide/styles.css" />
  </head>
  <body class="guide-page content-page" data-reading-route="{{READING_ROUTE}}">
    <a class="skip-link" href="#guide-content">跳到正文</a>
    <header class="site-header nb-head">
      <a class="brand nb-brand" href="../" aria-label="LearnDotnetCSharp 首页">LearnDotnetCSharp</a>
      <button class="nb-nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">菜单</button>
      <nav class="nb-nav nb-nav--collapsible" id="site-navigation" aria-label="资料导航">
        <a href="../guide/">教材</a><a href="../#catalog">实验</a><a href="../layers/">四层实验台</a><a aria-current="page" href="../#resources">资料</a><a href="../search/">搜索</a><a href="https://github.com/yuweiyang9611/LearnDotnetCSharp">GitHub</a><a href="https://yuweiyang9611.github.io/">全部项目</a>
      </nav>
    </header>
    <main class="guide-shell" id="main">
      <aside class="guide-sidebar" aria-label="页面目录">
        <div class="guide-sidebar-heading"><p>页面目录</p><span>{{HEADING_COUNT}} 节</span></div>
        <label class="toc-search"><span class="sr-only">筛选页面目录</span><input class="nb-input" type="search" data-toc-search placeholder="筛选目录" autocomplete="off" /></label>
        <p class="toc-search-status" data-toc-search-status aria-live="polite"></p>
        <nav class="guide-toc">{{TOC_HTML}}</nav>
        <p class="sidebar-links"><a href="../search/">搜索全部内容</a></p>
      </aside>
      <article class="guide-main">
        <header class="chapter-hero resource-page-hero">
          <nav class="breadcrumbs" aria-label="面包屑"><a href="../">首页</a><span aria-hidden="true">/</span><a href="../#resources">学习资料</a><span aria-hidden="true">/</span><span>{{DOCUMENT_TYPE}}</span></nav>
          <h1 id="{{PAGE_HEADING_ID}}" data-guide-heading>{{PAGE_TITLE}}</h1>
          <p class="chapter-lead">{{DESCRIPTION}}</p>
        </header>
        <details class="mobile-toc"><summary>页面目录</summary><nav class="guide-toc">{{TOC_HTML}}</nav></details>
        <div class="guide-content" id="guide-content">{{ARTICLE_HTML}}</div>
        <p class="guide-footer">继续学习：回到<a href="../guide/">教材目录</a>，或在全部教材与资料中<a href="../search/">全文搜索</a>。</p>
      </article>
    </main>
    <footer class="site-footer">
      <p>LearnDotnetCSharp · 在线教材与 PDF 由同一份 Markdown 生成。</p>
      <p class="footer-links"><a href="../#catalog">实验目录</a><a href="https://github.com/yuweiyang9611/LearnDotnetCSharp">项目源码</a></p>
    </footer>
    <button class="back-to-top nb-button" id="back-to-top" type="button">返回顶部</button>
    <div class="toast guide-toast" id="guide-toast" role="status" aria-live="polite"></div>
    <script src="../code-colors.js" defer></script>
    <script type="module" src="../navigation.js"></script>
    <script type="module" src="../guide/app.js"></script>
  </body>
</html>
