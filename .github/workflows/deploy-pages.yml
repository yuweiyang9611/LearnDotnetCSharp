name: Deploy study site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - site/**
      - scripts/build-study-site.mjs
      - output/pdf/LearnDotnetCSharp-Study-Guide.pdf
      - src/LearnDotnetCSharp.App/Demos/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and validate static site
        run: node scripts/build-study-site.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/study-site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
